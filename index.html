<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلويات أبو السعود</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- القسم الرئيسي -->
    <section class="hero">
        <h1 class="hero-title">حلويات أبو السعود</h1>
        <div class="divider"></div>
        <h2 class="hero-subtitle">أهلاً بكم</h2>
        <p class="hero-description">حيث يجتمع الطعم الأصيل مع الشخامة في كل قطعة</p>
        <button class="btn-browse">تصفح القائمة</button>
    </section>

    <!-- قسم المشروبات -->
    <section class="drinks-section">
        <h2 class="section-title">المشروبات المميزة</h2>
        <p class="section-subtitle">اختر مشروبك المفضل</p>
        
        <div class="drinks-grid">
            <!-- مشروب 1: الاسموزي -->
            <div class="drink-card">
                <div class="drink-image">
                    <img src="images/asmouzy.jpg" alt="اسموزي">
                </div>
                <h3 class="drink-name">الاسموزي</h3>
                <p class="drink-price">25 ريال</p>
                <button class="btn-add">أضف للسلة</button>
            </div>

            <!-- مشروب 2: الفرابيه -->
            <div class="drink-card">
                <div class="drink-image">
                    <img src="images/frappe.jpg" alt="فرابيه">
                </div>
                <h3 class="drink-name">الفرابيه</h3>
                <p class="drink-price">20 ريال</p>
                <button class="btn-add">أضف للسلة</button>
            </div>

            <!-- مشروب 3: الفرش -->
            <div class="drink-card">
                <div class="drink-image">
                    <img src="images/fresh.jpg" alt="فرش">
                </div>
                <h3 class="drink-name">الفرش</h3>
                <p class="drink-price">18 ريال</p>
                <button class="btn-add">أضف للسلة</button>
            </div>

            <!-- مشروب 4: القهوة العربية -->
            <div class="drink-card">
                <div class="drink-image">
                    <img src="images/arabic-coffee.jpg" alt="قهوة عربية">
                </div>
                <h3 class="drink-name">القهوة العربية</h3>
                <p class="drink-price">15 ريال</p>
                <button class="btn-add">أضف للسلة</button>
            </div>

            <!-- مشروب 5: العصير الطازج -->
            <div class="drink-card">
                <div class="drink-image">
                    <img src="images/juice.jpg" alt="عصير">
                </div>
                <h3 class="drink-name">العصير الطازج</h3>
                <p class="drink-price">22 ريال</p>
                <button class="btn-add">أضف للسلة</button>
            </div>

            <!-- مشروب 6: الشاي -->
            <div class="drink-card">
                <div class="drink-image">
                    <img src="images/tea.jpg" alt="شاي">
                </div>
                <h3 class="drink-name">الشاي</h3>
                <p class="drink-price">12 ريال</p>
                <button class="btn-add">أضف للسلة</button>
            </div>
        </div>
    </section>

    <!-- قسم المميزات -->
    <section class="features-section">
        <h2 class="features-title">قائمتنا المميزة</h2>
        <p class="features-subtitle">اكثر من أشهى حلويتنا الغربية</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
