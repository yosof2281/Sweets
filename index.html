<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> عيد ميلاد سعيد</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- الحاوية الخاصة بالقلوب الطايرة في الخلفية -->
<div id="hearts-container"></div>

<!-- 🎁 المرحلة الأولى: صندوق الهدية الكبيرة اللي بتهرب -->
<div id="gift-container" class="gift-section">
    <div class="gift-box">happy birthday</div>
    <button onclick="handleGiftClick()" class="open-btn big-cute-btn">
        اضغطي لفتح الهدية 
    </button>
</div>

<!-- 🎂 المرحلة الثانية: التورتة المعدلة وحبال الزينة ربع الدائرية -->
<div id="cake-container" class="cake-section" style="display: none;">
    <h2 class="cake-title">جارى تحضير حاجه حلوه شبهك </h2>
    
    <!-- حبال زينة ربع دائرية في الأركان فوق -->
    <div id="left-garland" class="garland left-side">
        <div class="string-arc"></div>
        <div class="flags-arc">
            <span class="flag f1"></span>
            <span class="flag f2"></span>
            <span class="flag f3"></span>
            <span class="flag f4"></span>
        </div>
    </div>
    <div id="right-garland" class="garland right-side">
        <div class="string-arc"></div>
        <div class="flags-arc">
            <span class="flag f4"></span>
            <span class="flag f3"></span>
            <span class="flag f2"></span>
            <span class="flag f1"></span>
        </div>
    </div>
    
    <div class="cake-wrapper">
        <!-- الشمعة المنورة -->
        <div class="cake-layer candle-real" id="candle">
            <div class="flame"></div>
        </div>
        
        <!-- الطابق الرابع: فانيليا بيضاء -->
        <div class="cake-layer layer-4-real" id="layer-4">
            <div class="drip-top"></div>
        </div>
        
        <!-- الطابق الثالث: فراولة بمبي بسييلان فانيليا بيضاء -->
        <div class="cake-layer layer-3-real" id="layer-3">
            <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="drip d4"></div>
        </div>
        
        <!-- الطابق الثاني: شوكولاتة بني بسييلان فراولة بمبي -->
        <div class="cake-layer layer-2-real" id="layer-2">
            <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="drip d4"></div><div class="drip d5"></div>
        </div>
        
        <!-- الطابق الأول: قاعدة الريد فيلفيت الكبيرة بسييلان شوكولاتة سايحة -->
        <div class="cake-layer layer-1-real" id="layer-1">
            <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="drip d4"></div><div class="drip d5"></div><div class="drip d6"></div>
        </div>
    </div>

    <!-- زرار الانتقال للمرحلة التالية -->
    <button id="cake-next-btn" onclick="goToEnvelope()" class="big-cute-btn" style="display: none; margin-top: 30px;">
        كملى ي قطتى 😍
    </button>
</div>

<!-- 💌 المرحلة الثالثة: ظرف الجواب والصور المرمية (مظبوط وثابت) -->
<div id="envelope-container" class="envelope-section" style="display: none;">
    <div class="envelope" onclick="openEnvelope()">
        <div class="flap"><div class="tear-line"></div></div>
        <div class="pocket"></div>
        
        <div class="letter custom-card">
            <div id="card-step-3" class="card-step text-step">
                <div class="card-text-content">
                    <h1 class="title">كل سنة وأنتِ طيبة يا قطتى 😍</h1>
                    <p class="text-content">
                        كل سنه وأنتِ طيبه ي قلبى وعقبال 100 سنه يارب وتحققى كل اللى نفسك فيه ونفرح بيكى بقا يارب  😂 كل سنه وأنتِ طيبة ي قطتييييييييييييي 😍
                    </p>
                    <div class="tags-container">
                        <span class="tag tag-pink">#أحلى_بنوته</span>
                        <span class="tag tag-purple">#عيد_ميلاد_سعيد</span>
                    </div>
                </div>
            </div>

            <div id="card-step-2" class="card-step photo-step" style="display: none;" onclick="throwSecondPhoto(event)">
                <img class="card-img" src="2.jpeg" alt="Photo 2">
                <p class="click-hint">الحلوه دى كبرت سنة 😍</p>
            </div>

            <div id="card-step-1" class="card-step photo-step" onclick="throwFirstPhoto(event)">
                <img class="card-img" src="1.jpeg" alt="Photo 1">
                <p class="click-hint">مزة مزة 😂</p>
            </div>
        </div>
    </div>
    <p class="hint-text">Surprise😍</p>
    <button onclick="restart()" class="close-btn">ابدئي من الأول تاني</button>
</div>

<script src="script.js"></script>
</body>
</html>
