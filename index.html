<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلويات أبو السعود</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- القسم الرئيسي -->
    <section class="hero">
        <h1 class="hero-title">حلويات أبو السعود</h1>
        <div class="divider"></div>
        <h2 class="hero-subtitle">أهلاً بكم</h2>
        <p class="hero-description">حيث يجتمع الطعم الأصيل مع الشخامة في كل قطعة</p>
        <button class="btn-browse">تصفح القائمة</button>
    </section>

    <!-- الأقسام الرئيسية -->
    <section class="categories-section">
        <div class="categories-grid">
            <!-- قسم الاسموزي -->
            <div class="category-card" data-category="asmouzy">
                <img src="images/asmouzy-thumb.jpg" alt="اسموزي">
                <h3>الاسموزي</h3>
            </div>

            <!-- قسم الفرابيه -->
            <div class="category-card" data-category="frappe">
                <img src="images/frappe-thumb.jpg" alt="فرابيه">
                <h3>الفرابيه</h3>
            </div>

            <!-- قسم الفرش -->
            <div class="category-card" data-category="fresh">
                <img src="images/fresh-thumb.jpg" alt="فرش">
                <h3>الفرش</h3>
            </div>

            <!-- قسم القهوة -->
            <div class="category-card" data-category="coffee">
                <img src="images/coffee-thumb.jpg" alt="قهوة">
                <h3>القهوة</h3>
            </div>
        </div>
    </section>

    <!-- عرض المنتجات -->
    <section class="products-section hidden" id="productsSection">
        <div class="products-container">
            <button class="btn-back">← رجوع</button>
            <h2 id="categoryTitle"></h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </section>

    <!-- قسم المميزات -->
    <section class="features-section">
        <h2 class="features-title">قائمتنا المميزة</h2>
        <p class="features-subtitle">اكثر من أشهى حلويتنا الغربية</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
