<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abo El-Saud Sweets - حلويات أبو السعود</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <style>
        :root {
            --primary-teal: #2c5e61;
            --primary-dark-teal: #244d50;
            --pure-white: #ffffff;
            --soft-gray: #e2e4e5;
            --text-dark: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--pure-white);
            color: var(--text-dark);
        }

        html[dir="rtl"] body {
            direction: rtl;
        }

        /* Staggered fade-in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Navbar */
        .navbar {
            background-color: var(--pure-white);
            border-bottom: 2px solid var(--soft-gray);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(44, 94, 97, 0.08);
        }

        /* Primary teal background */
        .bg-primary-teal {
            background-color: var(--primary-teal);
        }

        .bg-primary-dark-teal {
            background-color: var(--primary-dark-teal);
        }

        .text-primary-teal {
            color: var(--primary-teal);
        }

        /* Category Pills */
        .category-pill {
            padding: 8px 20px;
            border-radius: 24px;
            border: 2px solid var(--soft-gray);
            background-color: var(--pure-white);
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            white-space: nowrap;
        }

        .category-pill:hover {
            border-color: var(--primary-teal);
            color: var(--primary-teal);
        }

        .category-pill.active {
            background-color: var(--primary-teal);
            color: var(--pure-white);
            border-color: var(--primary-teal);
        }

        /* Shopping Cart Badge */
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* Product Cards */
        .product-card {
            background-color: var(--pure-white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(44, 94, 97, 0.1);
            transition: all 0.3s ease;
            border: 1px solid var(--soft-gray);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(44, 94, 97, 0.15);
        }

        .product-image {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, var(--soft-gray) 0%, #d4d6d7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-teal);
            margin-bottom: 8px;
        }

        .product-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-teal);
            margin-bottom: 12px;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--primary-teal);
            color: var(--pure-white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-to-cart-btn:hover {
            background-color: var(--primary-dark-teal);
            transform: scale(1.02);
        }

        /* Modal / Slide-out Cart */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .cart-modal {
            background-color: var(--pure-white);
            position: fixed;
            right: 0;
            top: 0;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            z-index: 110;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.15);
        }

        .cart-modal.active {
            transform: translateX(0);
        }

        html[dir="rtl"] .cart-modal {
            right: auto;
            left: 0;
            transform: translateX(-100%);
        }

        html[dir="rtl"] .cart-modal.active {
            transform: translateX(0);
        }

        .cart-header {
            background-color: var(--primary-teal);
            color: var(--pure-white);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--soft-gray);
            margin-bottom: 12px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: var(--primary-teal);
            margin-bottom: 4px;
        }

        .cart-item-quantity {
            font-size: 13px;
            color: #666;
        }

        .cart-item-price {
            font-weight: 600;
            color: var(--primary-teal);
            margin-right: 12px;
        }

        .remove-item-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .remove-item-btn:hover {
            background-color: #ee5a52;
        }

        .checkout-form {
            padding: 20px;
            border-top: 2px solid var(--soft-gray);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--primary-teal);
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--soft-gray);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(44, 94, 97, 0.1);
        }

        .cart-summary {
            padding: 20px;
            border-top: 2px solid var(--soft-gray);
            background-color: var(--soft-gray);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .summary-row.total {
            font-weight: 700;
            color: var(--primary-teal);
            font-size: 16px;
            border-top: 1px solid rgba(44, 94, 97, 0.2);
            padding-top: 8px;
            margin-top: 8px;
        }

        .whatsapp-btn {
            width: 100%;
            padding: 14px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            margin-top: 12px;
        }

        .whatsapp-btn:hover {
            background-color: #1fa952;
            transform: scale(1.02);
        }

        .whatsapp-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary-teal) 0%, var(--primary-dark-teal) 100%);
            color: var(--pure-white);
            padding: 60px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 24px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cart-modal {
                max-width: 100%;
            }

            .hero h1 {
                font-size: 32px;
            }

            .category-pills-container {
                scroll-snap-type: x mandatory;
            }

            .category-pill {
                scroll-snap-align: start;
            }

            .category-pill.active {
                margin-left: 8px;
            }
        }

        /* Empty Cart Message */
        .empty-cart-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-cart-message svg {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Language Switcher */
        .lang-switch-btn {
            background-color: var(--primary-teal);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .lang-switch-btn:hover {
            background-color: var(--primary-dark-teal);
            transform: scale(1.05);
        }
    </style>
</head>

                    <button class="category-pill" data-category="macarons">Macarons</button>
                    <button class="category-pill" data-category="eclairs">Eclairs</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h2 id="cartTitle">Shopping Cart</h2>
            <button id="closeCartBtn" class="text-2xl leading-none hover:opacity-70 transition">&times;</button>
        </div>

        <div class="cart-content" id="cartContent">
            <div class="empty-cart-message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <p id="emptyMsg">Your cart is empty</p>
            </div>
        </div>

        <div class="checkout-form">
            <form id="checkoutForm">
                <div class="form-group">
                    <label class="form-label" for="deliveryAddress">Delivery Address</label>
                    <input type="text" id="deliveryAddress" class="form-input" placeholder="Enter your address" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="customerName">Full Name</label>
                    <input type="text" id="customerName" class="form-input" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" class="form-input" placeholder="Your phone" required>
                </div>
            </form>
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span id="subtotalLabel">Subtotal:</span>
                <span id="subtotalValue">0 LE</span>
            </div>
            <div class="summary-row total">
                <span id="totalLabel">Total:</span>
                <span id="totalValue">0 LE</span>
            </div>
            <button class="whatsapp-btn" id="whatsappBtn" disabled>📱 Order via WhatsApp</button>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero animate-fade-in-up">
        <div class="max-w-4xl mx-auto">
            <h1 id="heroTitle" class="stagger-1 animate-fade-in-up">Premium Artisan Sweets</h1>
            <p id="heroSubtitle" class="stagger-2 animate-fade-in-up">Handcrafted luxury desserts from Abo El-Saud</p>
        </div>
    </section>

    <!-- Products Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="productsGrid">
            <!-- Products will be inserted here by JavaScript -->
        </div>
    </main>
